name: see_for_designs
description: "A woodworking design catalog app for DWG files"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.5
  sqflite: ^2.3.0
  path_provider: ^2.1.3
  file_picker: ^6.2.0
  share_plus: ^7.0.0
  pdf: ^3.10.5
  printing: ^5.11.1
  intl: ^0.19.0
  uuid: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
