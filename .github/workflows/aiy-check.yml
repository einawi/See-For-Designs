name: AIy quick check
# aiy-workflow v7
on:
  workflow_dispatch:
  push:
    paths:
      - '.aiy/check-request.txt'

concurrency:
  group: aiy-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Check the code
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
